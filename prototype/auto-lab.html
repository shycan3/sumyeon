<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔광 원정대 · 오토 덱·방침 비교</title><link rel="stylesheet" href="style.css?v=traitauto1"><link rel="stylesheet" href="character.css?v=serinlook1"><script defer src="data.js?v=traitauto1"></script><script defer src="character-data.js?v=traitauto1"></script><script defer src="presentation-data.js?v=serinlook1"></script><script defer src="engine.js?v=traitauto1"></script><script defer src="actor-ai.js?v=traitauto1"></script><script defer src="character-engine.js?v=traitauto1"></script><script defer src="presentation-settings.js?v=serinlook1"></script><script defer src="skill-director.js?v=serinlook1"></script><script defer src="spectator.js?v=serinlook1"></script><script defer src="auto-lab-core.js?v=traitauto1"></script><script defer src="auto-lab.js?v=traitauto1"></script></head><body><header class="topbar"><a class="brand" href="character.html?v=traitauto1">✦ 잔광 원정대</a><a href="character.html?v=traitauto1">원정으로</a></header><main><h1>오토 덱·방침 비교</h1><p class="note">같은 캐릭터 Lv.1·태세·적·시드에서 편성과 방침을 바꿔보세요. 보상 카드를 넣은 체험용 덱이며 원정 저장에 영향을 주지 않습니다. 부상 조건은 비교를 위한 시작 HP입니다.</p><section class="panel"><div class="auto-lab-options"><label>전투<select id="scenario"></select></label><label>편성<select id="build"></select></label><label>방침<select id="policy"><option value="attack">공격 중심</option><option value="protect">보호 중심</option></select></label><label>운영 비교<select id="operation"><option value="traits">특성 활용</option><option value="previous">이전 운영</option></select></label><label>시작 HP<select id="ratio"><option value="1">100%</option><option value="0.45">45%</option><option value="0.25">25%</option></select></label><label>시드<input id="seed" type="number" min="0" max="4294967295" value="37"></label></div><p class="note" id="deck-summary"></p><button id="start">자동 전투 시작</button><p class="warning" id="error" role="status"></p></section><section class="panel character-battle auto-lab-stage"><div class="battle-watch"><strong id="status">조건을 선택하고 전투를 시작하세요.</strong><button id="pause" disabled>관전 일시정지</button><label>속도<select id="speed"><option value="1">1배</option><option value="2">2배</option></select></label><button id="presentation">연출 전체</button><button id="sound">소리 켜기</button></div><div class="moment-banner" id="moment-banner"></div><div class="arena"><canvas id="field" width="960" height="390" aria-label="자동 전투 비교 전장"></canvas></div><div class="auto-info" id="decision"></div><div id="awareness"></div><details><summary>현재 덱 20장</summary><p class="note" id="deck-list"></p></details></section><section class="panel" style="margin-top:16px"><h2>최근 비교 결과</h2><p class="note">같은 전투·편성·방침·시작 HP·시드에서 운영만 바꿔 비교할 수 있습니다. 이전 운영도 특성 효과는 같고 카드 판단만 다릅니다. 화면을 닫으면 이 체험 기록은 사라집니다.</p><div id="results"></div></section></main></body></html>
